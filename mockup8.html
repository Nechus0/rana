<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/app.css">
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    #app { height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-rail-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 4h5v12H3zM10 4h7M10 8h7M10 12h5" stroke="currentColor" fill="none"/></svg></button>
      <span class="brand-name">Rana</span>
      <span class="brand-version">arvalis</span>
      <span class="brand-ver-num">2.1.0</span>
    </div>
    <div class="topbar-center">
      <span class="topbar-patient">Max Mustermann</span>
    </div>
    <div class="topbar-right">
      <span class="save-indicator">
        <span class="save-dot"></span>
        <span class="save-text">Gespeichert</span>
      </span>
      <button class="btn btn-sm btn-quiet btn-icon" id="btnEinstellungen" title="Einstellungen" aria-label="Einstellungen"><svg width="20" height="20"><circle cx="10" cy="5" r="1.3" fill="currentColor"/><circle cx="10" cy="10" r="1.3" fill="currentColor"/><circle cx="10" cy="15" r="1.3" fill="currentColor"/></svg></button>
      <button class="topbar-ctx-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M12 4h5v12h-5zM3 4h7M3 8h7M3 12h5" stroke="currentColor" fill="none"/></svg></button>
    </div>
  </header>
  <div class="shell">
    <nav class="rail">
      <div class="rail-body">
        <div class="rail-head">
          <span class="record">Fälle</span>
          <span class="record-num small muted">12</span>
        </div>
        <div class="case-search">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2"/></svg>
          <input type="search" placeholder="Suchen …" class="rail-search">
        </div>
        <div class="row" style="margin: 0 var(--s3) var(--s3);">
          <select style="flex:1;"><option>Sortierung: Zuletzt geändert</option></select>
          <select style="flex:1;"><option>Alle zeigen</option></select>
          <button class="btn btn-icon btn-sm btn-quiet" style="flex:none;"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 6L8 10L12 6" fill="none" stroke="currentColor"/></svg></button>
        </div>
        <ul class="case-list">
          <li class="case-item is-active" style="background:var(--arvalis-wash);"><span class="patient-name">Max Mustermann</span></li>
          <li class="case-item"><span class="patient-name">Erika Musterfrau</span></li>
        </ul>
      </div>
      <div class="rail-foot">
        <button class="btn btn-sm"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2"/></svg> Neuer Patient</button>
        <button class="btn btn-sm btn-quiet"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2"/></svg> Aus Ordner</button>
      </div>
    </nav>
    <main class="work">
      <header class="work-head">
        <nav class="stepbar">
          <button class="stepbar-step is-current"><span class="stepbar-node">1</span><span class="stepbar-label">Stammdaten</span></button>
          <button class="stepbar-step"><span class="stepbar-node">2</span><span class="stepbar-label">Vorbericht</span></button>
          <button class="stepbar-step"><span class="stepbar-node">3</span><span class="stepbar-label">Verlauf</span></button>
          <button class="stepbar-step"><span class="stepbar-node">4</span><span class="stepbar-label">Formulieren</span></button>
          <button class="stepbar-step"><span class="stepbar-node">5</span><span class="stepbar-label">Ausgabe</span></button>
        </nav>
        <div class="work-head-titel"><div class="work-title"><span class="work-eyebrow">Schritt 1 von 5</span><h2>Fall-Stammdaten</h2></div></div>
      </header>
      <div class="work-body">
        <div class="work-inner">
          <section class="group">
            <div class="group-head"><span class="group-title">Grunddaten des Falls</span></div>
            <div class="group-body">
              <div class="grid-3" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;">
                <div class="field" style="grid-column: span 3"><label>Patient:in</label><input type="text" value="Max Mustermann"></div>
                <div class="field"><label>Chiffre / Pseudonym</label><input type="text" value="M.M."></div>
                <div class="field"><label>Geburtsdatum</label><input type="date"></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <aside class="context">
      <div class="context-body">
        <section class="ctx-block">
          <span class="record">Vollständigkeit</span>
          <div class="completeness">
            <div class="comp-value" style="font-size:24px; font-weight:bold;">15<small style="font-size:12px; font-weight:normal; color:var(--reed);"> %</small></div>
            <div class="comp-bar" style="height:4px; background:var(--line); border-radius:2px;"><div class="comp-fill" style="width:15%; height:100%; background:var(--arvalis); border-radius:2px;"></div></div>
          </div>
          <ul class="gap-list" style="list-style:none; padding:0; margin-top:16px;">
            <li style="margin-bottom:8px;"><button class="gap-item" style="border:none;background:none;text-align:left;display:flex;gap:8px;font:inherit;cursor:pointer;"><span class="gap-num" style="background:var(--amber);color:#fff;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:bold;">1</span>Lfd. Nr. des Fortführungsantrags</button></li>
            <li style="margin-bottom:8px;"><button class="gap-item" style="border:none;background:none;text-align:left;display:flex;gap:8px;font:inherit;cursor:pointer;"><span class="gap-num" style="background:var(--amber);color:#fff;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:bold;">1</span>Therapiebeginn</button></li>
            <li style="margin-bottom:8px;"><button class="gap-item" style="border:none;background:none;text-align:left;display:flex;gap:8px;font:inherit;cursor:pointer;"><span class="gap-num" style="background:var(--amber);color:#fff;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:bold;">3</span>Aktueller psychischer Befund</button></li>
          </ul>
        </section>
        <section class="ctx-block">
          <span class="record">Dieser Fall</span>
          <p class="hint">Chiffre M.M.<br>Zuletzt geändert heute</p>
        </section>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
