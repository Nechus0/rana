<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/app.css">
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    #app { height: 100vh; display: flex; flex-direction: column; }
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-rail-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 4h5v12H3zM10 4h7M10 8h7M10 12h5" stroke="currentColor" fill="none"/></svg></button>
      <span class="brand-name">Rana</span>
      <span class="brand-version">arvalis</span>
      <span class="brand-ver-num">2.1.0</span>
    </div>
    <div class="topbar-center">
      <span class="topbar-patient">Max Mustermann</span>
    </div>
    <div class="topbar-right">
      <span class="save-indicator">
        <span class="save-dot"></span>
        <span class="save-text">Gespeichert</span>
      </span>
      <div class="menuwrap">
        <button class="btn btn-sm btn-quiet btn-icon"><svg width="20" height="20"><circle cx="10" cy="5" r="1.3" fill="currentColor"/><circle cx="10" cy="10" r="1.3" fill="currentColor"/><circle cx="10" cy="15" r="1.3" fill="currentColor"/></svg></button>
      </div>
      <button class="topbar-ctx-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M12 4h5v12h-5zM3 4h7M3 8h7M3 12h5" stroke="currentColor" fill="none"/></svg></button>
    </div>
  </header>
  <div class="shell" style="grid-template-columns: 264px minmax(0, 1fr) 296px;">
    <nav class="rail">
      <div class="rail-body">
        <div class="rail-head"><span class="record">Fälle</span><span class="record-num small muted">12</span></div>
        <div class="rail-filter"><input type="search" placeholder="Suchen …" class="rail-search"></div>
        <ul class="nav-list" style="margin-top:16px;">
          <li class="patient is-active" style="padding:8px 16px; background:var(--reed); color:#fff; border-radius:6px; margin:0 8px;"><span class="patient-name">Max Mustermann</span></li>
          <li class="patient" style="padding:8px 16px;"><span class="patient-name">Erika Musterfrau</span></li>
        </ul>
      </div>
    </nav>
    <main class="work">
      <header class="work-head">
        <nav class="stepbar">
          <button class="stepbar-step is-current" aria-selected="true"><span class="stepbar-node">1</span><span class="stepbar-label">Stammdaten</span></button>
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">2</span><span class="stepbar-label">Vorbericht</span></button>
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">3</span><span class="stepbar-label">Verlauf</span></button>
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">4</span><span class="stepbar-label">Formulieren</span></button>
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">5</span><span class="stepbar-label">Ausgabe</span></button>
        </nav>
        <div class="work-head-titel"><div class="work-title"><span class="work-eyebrow">Schritt 1 von 5</span><h2>Fall-Stammdaten</h2></div></div>
      </header>
      <div class="work-body">
        <div class="work-inner">
          <section class="group">
            <div class="group-head"><span class="group-title">Grunddaten des Falls</span></div>
            <div class="group-body">
              <div class="grid-3" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;">
                <div class="field" style="grid-column: span 3"><label>Patient:in</label><input type="text" value="Max Mustermann"></div>
                <div class="field"><label>Chiffre / Pseudonym</label><input type="text" value="M.M."></div>
                <div class="field"><label>Geburtsdatum</label><input type="date"></div>
              </div>
            </div>
          </section>
        </div>
      </div>
      <footer class="work-foot"><button class="btn">Zurück</button><span class="spacer"></span><button class="btn btn-primary">Weiter</button></footer>
    </main>
    <aside class="context">
      <div class="context-body">
        <div class="context-head"><span class="record">Vollständigkeit</span><span class="record-num large">15 %</span></div>
        <ul class="gap-list" style="margin-top:16px; list-style:none; padding:0;">
          <li style="margin-bottom:8px;"><button class="gap-item" style="border:none;background:none;text-align:left;display:flex;gap:8px;font:inherit;cursor:pointer;"><span class="gap-num" style="background:var(--amber);color:#fff;border-radius:12px;padding:0 6px;font-size:11px;">1</span>Lfd. Nr. des Fortführungsantrags</button></li>
          <li style="margin-bottom:8px;"><button class="gap-item" style="border:none;background:none;text-align:left;display:flex;gap:8px;font:inherit;cursor:pointer;"><span class="gap-num" style="background:var(--amber);color:#fff;border-radius:12px;padding:0 6px;font-size:11px;">1</span>Therapiebeginn</button></li>
          <li style="margin-bottom:8px;"><button class="gap-item" style="border:none;background:none;text-align:left;display:flex;gap:8px;font:inherit;cursor:pointer;"><span class="gap-num" style="background:var(--amber);color:#fff;border-radius:12px;padding:0 6px;font-size:11px;">3</span>Aktueller psychischer Befund</button></li>
        </ul>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
