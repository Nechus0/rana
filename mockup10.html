<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/app.css">
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    #app { height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-rail-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 4h5v12H3zM10 4h7M10 8h7M10 12h5" stroke="currentColor" fill="none"/></svg></button>
      <span class="brand-name">Rana</span>
      <span class="brand-version">arvalis</span>
      <span class="brand-ver-num">2.1.0</span>
    </div>
    <div class="topbar-center">
      <span class="topbar-patient"></span>
    </div>
    <div class="topbar-right">
      <span class="save-indicator">
        <span class="save-dot"></span>
        <span class="save-text">Gespeichert</span>
      </span>
      <button class="btn btn-sm btn-quiet btn-icon" id="btnEinstellungen" title="Einstellungen" aria-label="Einstellungen"><svg width="20" height="20"><circle cx="10" cy="5" r="1.3" fill="currentColor"/><circle cx="10" cy="10" r="1.3" fill="currentColor"/><circle cx="10" cy="15" r="1.3" fill="currentColor"/></svg></button>
      <button class="topbar-ctx-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M12 4h5v12h-5zM3 4h7M3 8h7M3 12h5" stroke="currentColor" fill="none"/></svg></button>
    </div>
  </header>
  <div class="shell">
    <nav class="rail">
      <div class="rail-body">
        <div class="rail-head">
          <span class="record">Fälle</span>
          <span class="record-num small muted">12</span>
        </div>
        <div class="case-search">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2"/></svg>
          <input type="search" placeholder="Suchen …" class="rail-search">
        </div>
        <div class="row rail-filters">
          <select id="fallSort" aria-label="Fälle ordnen nach" style="flex:1;">
            <option>Name (A-Z)</option>
            <option>Zuletzt geändert</option>
          </select>
          <select id="fallFilter" aria-label="Fälle filtern" style="flex:1;">
            <option value="alle">Alle zeigen</option>
          </select>
        </div>
        <ul class="case-list">
          <li class="case-item"><span class="patient-name">Max Mustermann</span></li>
          <li class="case-item"><span class="patient-name">Erika Musterfrau</span></li>
        </ul>
      </div>
      <div class="rail-foot">
        <button class="btn btn-sm"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2"/></svg> Neuer Patient</button>
        <button class="btn btn-sm btn-quiet"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2"/></svg> Aus Ordner</button>
      </div>
    </nav>
    <main class="work">
      <header class="work-head">
        <nav class="stepbar" style="display:none;"></nav>
        <div class="work-head-titel"><div class="work-title"><span class="work-eyebrow"></span><h2>Willkommen bei Rana</h2></div></div>
      </header>
      <div class="work-body">
        <div class="work-inner">
          <div style="text-align:center; padding: 120px 20px; color: var(--peat);">
            <svg width="48" height="48" viewBox="0 0 24 24" style="margin-bottom: 20px; color: var(--reed);">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <h3>Kein Fall ausgewählt</h3>
            <p style="margin-bottom: 24px; color: var(--reed);">Wählen Sie einen Patienten aus der Liste<br>oder legen Sie einen neuen Fall an.</p>
            <button class="btn btn-primary" id="btnEmptyNeuerFall">Neuen Fall anlegen</button>
          </div>
        </div>
      </div>
    </main>
    <aside class="context" style="display:none;"></aside>
  </div>
</div>
</body>
</html>
