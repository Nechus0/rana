<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/app.css">
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    #app { height: 100vh; display: flex; flex-direction: column; }
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-rail-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 4h5v12H3zM10 4h7M10 8h7M10 12h5" stroke="currentColor" fill="none"/></svg></button>
      <span class="brand-name">Rana</span>
      <span class="brand-version">arvalis</span>
      <span class="brand-ver-num">2.1.0</span>
    </div>
    <div class="topbar-center">
      <span class="topbar-patient">Max Mustermann</span>
    </div>
    <div class="topbar-right">
      <span class="save-indicator">
        <span class="save-dot"></span>
        <span class="save-text">Gespeichert</span>
      </span>
      <div class="menuwrap">
        <button class="btn btn-sm btn-quiet btn-icon" aria-expanded="true"><svg width="20" height="20"><circle cx="10" cy="5" r="1.3" fill="currentColor"/><circle cx="10" cy="10" r="1.3" fill="currentColor"/><circle cx="10" cy="15" r="1.3" fill="currentColor"/></svg></button>
        <div class="menu">
          <button class="menu-item"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3A5 5 0 1 0 8 13A5 5 0 1 0 8 3" fill="none" stroke="currentColor"/></svg><span>Einstellungen</span></button>
          <button class="menu-item"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3A5 5 0 1 0 8 13A5 5 0 1 0 8 3" fill="none" stroke="currentColor"/></svg><span>Sicherung</span></button>
          <button class="menu-item"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3A5 5 0 1 0 8 13A5 5 0 1 0 8 3" fill="none" stroke="currentColor"/></svg><span>Papierkorb</span></button>
        </div>
      </div>
      <button class="topbar-ctx-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M12 4h5v12h-5zM3 4h7M3 8h7M3 12h5" stroke="currentColor" fill="none"/></svg></button>
    </div>
  </header>
  <div class="shell" style="grid-template-columns: 264px minmax(0, 1fr) 296px;">
    <nav class="rail">
      <div class="rail-body">
        <div class="rail-head"><span class="record">Fälle</span><span class="record-num small muted">12</span></div>
      </div>
    </nav>
    <main class="work">
      <header class="work-head">
        <nav class="stepbar">
          <button class="stepbar-step" aria-selected="true"><span class="stepbar-node">1</span><span class="stepbar-label">Stammdaten</span></button>
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">2</span><span class="stepbar-label">Vorbericht</span></button>
        </nav>
      </header>
      <div class="work-body" style="position:relative;">
        <div class="scrim" style="position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;">
          <div class="dialog" style="width:880px;height:500px;">
            <div class="dialog-head">
              <h3>Einstellungen</h3>
            </div>
            <div class="dialog-body settings">
              <nav class="settings-nav">
                <button class="settings-tab">Praxis</button>
                <button class="settings-tab">Claude-Zugang</button>
                <button class="settings-tab active">Verbrauch</button>
              </nav>
              <div class="settings-main">
                <section>
                  <div class="group">
                    <div class="group-head"><span class="group-title">Aktueller Verbrauch</span></div>
                    <div class="budget">
                      <div class="budget-row"><span class="budget-amount">12,50 €</span><span class="budget-of">von 50,00 €</span></div>
                      <div class="budget-bar"><div class="budget-fill" style="--used:25%"></div></div>
                      <p class="hint">2 von 10 Berichten heute</p>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <aside class="context">
      <div class="context-body">
        <ul class="gap-list">
          <li><button class="gap-item"><span class="gap-num">2</span>Bisherige ICD-10-Diagnose(n)</button></li>
          <li><button class="gap-item"><span class="gap-num">3</span>Aktueller psychischer Befund</button></li>
        </ul>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
