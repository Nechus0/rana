[package]
name = "pruef"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"

chrono = { version = "0.4", features = ["serde"] }
tauri = { path = "stub-tauri" }
keyring = { path = "stub-keyring" }
reqwest = { path = "stub-reqwest" }
