[package]
name = "rana"
version = "2.4.2"
description = "Rana — Assistent für Berichte an den Gutachter"
authors = ["Rana"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rana_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Aktualisierung: prüft bei GitHub und installiert signierte Fassungen.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Netz: ausschliesslich rustls, kein System-OpenSSL. Das hält den
# Windows-Build frei von C-Abhängigkeiten und macht ihn reproduzierbar.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

# Datenhaltung. SQLite wird mitgeliefert, nichts muss auf dem
# Zielrechner vorhanden sein.
rusqlite = { version = "0.32", features = ["bundled"] }

# Verschlüsselung der Falldaten. Reines Rust, kein OpenSSL.
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# Schlüsselableitung für das Passwort der Sicherungsdatei.
pbkdf2 = "0.12"
sha2 = "0.10"

# Der Windows Credential Manager
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"

# Text extraction from previous reports
pdf-extract = "0.7"
zip = "2.2"
quick-xml = "0.36"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
