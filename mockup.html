<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/app.css">
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    #app { height: 100vh; display: flex; flex-direction: column; }
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-rail-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 4h5v12H3zM10 4h7M10 8h7M10 12h5" stroke="currentColor" fill="none"/></svg></button>
      <span class="brand-name">Rana</span>
      <span class="brand-version">arvalis</span>
      <span class="brand-ver-num">2.1.0</span>
    </div>
    <div class="topbar-center">
      <span class="topbar-patient">Max Mustermann</span>
    </div>
    <div class="topbar-right">
      <span class="save-indicator">
        <span class="save-dot"></span>
        <span class="save-text">Gespeichert</span>
      </span>
      <div class="menuwrap">
        <button class="btn btn-sm btn-quiet btn-icon"><svg width="20" height="20"><circle cx="10" cy="5" r="1.3" fill="currentColor"/><circle cx="10" cy="10" r="1.3" fill="currentColor"/><circle cx="10" cy="15" r="1.3" fill="currentColor"/></svg></button>
      </div>
      <button class="topbar-ctx-toggle"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M12 4h5v12h-5zM3 4h7M3 8h7M3 12h5" stroke="currentColor" fill="none"/></svg></button>
    </div>
  </header>
  <div class="shell">
    <nav class="rail collapsed">
      <div class="rail-collapsed" style="display:flex;">
        <button class="rail-tab"><span class="rail-tab-label">FÄLLE</span></button>
      </div>
    </nav>
    <main class="work">
      <header class="work-head">
        <nav class="stepbar">
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">1</span><span class="stepbar-label">Stammdaten</span></button>
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">2</span><span class="stepbar-label">Vorbericht</span></button>
          <button class="stepbar-step" aria-selected="true"><span class="stepbar-node">3</span><span class="stepbar-label">Verlauf</span></button>
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">4</span><span class="stepbar-label">Formulieren</span></button>
          <button class="stepbar-step" aria-selected="false"><span class="stepbar-node">5</span><span class="stepbar-label">Ausgabe</span></button>
        </nav>
        <div class="work-head-titel"><div class="work-title"><h2>Verlauf und aktueller Stand</h2></div></div>
      </header>
      <div class="work-body">
        <div class="work-inner">
          <section class="group">
            <div class="group-head"><span class="group-num">1</span><span class="group-title">Behandlungsverlauf seit dem letzten Bericht</span></div>
            <div class="group-body">
              <div class="field"><label>Ausgangslage bei Therapiebeginn</label><textarea style="min-height:150px">Wodurch wurde die Behandlung ausgelöst...</textarea></div>
            </div>
          </section>
        </div>
      </div>
      <footer class="work-foot"><button class="btn">Zurück</button><span class="spacer"></span><button class="btn btn-primary">Weiter</button></footer>
    </main>
    <aside class="context collapsed">
      <div class="context-collapsed" style="display:flex;">
        <button class="rail-tab"><span class="rail-tab-label">ÜBERSICHT</span></button>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
